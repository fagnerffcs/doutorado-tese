apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: astronomy-shop-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels: {}
  namespaceSelector:
    matchNames:
      - otel-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 30s