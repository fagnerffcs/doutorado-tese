---
- name: Teardown PANOPTES Observability Stack
  hosts: k8s_cluster
  gather_facts: false
  vars:
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG') | default(ansible_env.HOME ~ '/.kube/config', true) }}"
    monitoring_namespace: "monitoring"
    cert_manager_namespace: "cert-manager"
  tasks:
    - name: Remove PANOPTES Collector Custom Resource
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        definition:
          apiVersion: opentelemetry.io/v1alpha1
          kind: OpenTelemetryCollector
          metadata:
            name: panoptes-collector
            namespace: "{{ monitoring_namespace }}"
      ignore_errors: true

    - name: Remove ServiceMonitors
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: monitoring.coreos.com/v1
        kind: ServiceMonitor
        name: "{{ item }}"
        namespace: "{{ monitoring_namespace }}"
      loop:
        - tempo-monitor
        - astronomy-shop-monitor
      ignore_errors: true

    - name: Uninstall PANOPTES Helm Releases
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: "{{ item }}"
        release_namespace: "{{ monitoring_namespace }}"
        state: absent
        wait: true
      loop:
        - panoptes-collector
        - tempo
        - promtail
        - loki
        - kube-prometheus-stack
        - opentelemetry-operator
      ignore_errors: true

    - name: Uninstall Cert-Manager Helm Release
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: cert-manager
        release_namespace: "{{ cert_manager_namespace }}"
        state: absent
        wait: true
      ignore_errors: true

    - name: Ensure namespaces are completely removed
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: v1
        kind: Namespace
        name: "{{ item }}"
        state: absent
        wait: true
        wait_timeout: 180
      loop:
        - "{{ monitoring_namespace }}"
        - "{{ cert_manager_namespace }}"
      ignore_errors: true

    - name: Remove Orphaned CRDs to avoid API Server pollution
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item }}"
      loop:
        - opentelemetrycollectors.opentelemetry.io
        - instrumentations.opentelemetry.io
        - servicemonitors.monitoring.coreos.com
        - podmonitors.monitoring.coreos.com
        - prometheuses.monitoring.coreos.com
      ignore_errors: true