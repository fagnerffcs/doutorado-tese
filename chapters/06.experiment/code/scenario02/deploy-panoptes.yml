---
- name: PANOPTES Scenario Provisioning
  hosts: localhost
  connection: local
  vars:
    monitoring_namespace: "monitoring"
    app_namespace: "otel-demo"
    chaos_namespace: "chaos-mesh"

  tasks:
    - name: Ensure required namespaces exist
      kubernetes.core.k8s:
        name: "{{ item }}"
        api_version: v1
        kind: Namespace
        state: present
      loop:
        - "{{ monitoring_namespace }}"
        - "{{ app_namespace }}"
        - "{{ chaos_namespace }}"

    - name: Self-Heal stuck Helm releases (Clear pending locks)
      shell: |
        kubectl delete secret -A -l status=pending-install --ignore-not-found
        kubectl delete secret -A -l status=pending-upgrade --ignore-not-found
      changed_when: false
      tags: always

    - name: Add necessary Helm repositories
      kubernetes.core.helm_repository:
        name: "{{ item.name }}"
        repo_url: "{{ item.url }}"
      loop:
        - { name: 'prometheus-community', url: 'https://prometheus-community.github.io/helm-charts' }
        - { name: 'grafana', url: 'https://grafana.github.io/helm-charts' }
        - { name: 'chaos-mesh', url: 'https://charts.chaos-mesh.org' }
        - { name: 'open-telemetry', url: 'https://open-telemetry.github.io/opentelemetry-helm-charts' }
        - { name: 'jetstack', url: 'https://charts.jetstack.io' }

    - block:
        - name: Deploy OpenTelemetry Astronomy Shop (Linked directly to PANOPTES)
          kubernetes.core.helm:
            name: telemetry-shop
            chart_ref: open-telemetry/opentelemetry-demo
            release_namespace: "{{ app_namespace }}"
            wait: false
            timeout: "20m"
            values:
              jaeger:
                enabled: false
              prometheus:
                enabled: false
              grafana:
                enabled: false
              opentelemetry-collector:
                enabled: false
              global:
                collector:
                  endpoint: "panoptes-collector-collector.monitoring:4317"
                env:
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: "http://panoptes-collector-collector.monitoring:4317"

        - name: Install Chaos Mesh
          kubernetes.core.helm:
            name: chaos-mesh
            chart_ref: chaos-mesh/chaos-mesh
            release_namespace: "{{ chaos_namespace }}"
            wait: true
            timeout: "10m"
            values:
              chaosDaemon:
                runtime: containerd
                socketPath: /run/k3s/containerd/containerd.sock
      rescue:
        - fail:
            msg: "[ERROR] Failed to deploy the target workload or Chaos Mesh. Check cluster capacity."

    - block:
        - name: Deploy Cert-Manager (Required by OTEL Operator)
          kubernetes.core.helm:
            name: cert-manager
            chart_ref: jetstack/cert-manager
            release_namespace: cert-manager
            create_namespace: true
            wait: true
            timeout: "10m"
            values:
              crds:
                enabled: true

        - name: Await Cert-Manager Webhook stabilization
          pause:
            seconds: 40
            prompt: "Waiting for Cert-Manager webhooks to fully register endpoints with the API Server..."

        - name: Create centralized values.yaml for kube-prometheus-stack
          copy:
            dest: "/home/vagrant/kube-prometheus-values.yaml"
            content: |
              grafana:
                adminPassword: nf3wtnCPKTVQAfPMo9SOWF9KOWdGbilsUOhSMbdB
                sidecar:
                  dashboards:
                    enabled: true
                    label: grafana_dashboard
                service:
                  type: NodePort
                  nodePort: 32000
                enabled: true
                additionalDataSources:
                  - name: Loki
                    type: loki
                    url: http://loki.monitoring.svc.cluster.local:3100
                    access: proxy
                  - name: Tempo
                    type: tempo
                    url: http://tempo.monitoring.svc.cluster.local:3200
                    access: proxy
              prometheus:
                prometheusSpec:
                  serviceMonitorSelectorNilUsesHelmValues: false
                  resources:
                    requests:
                      cpu: 250m
                      memory: 512Mi
                    limits:
                      cpu: 1
                      memory: 2Gi
              kube-state-metrics:
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                readinessProbe:
                  initialDelaySeconds: 30
                  timeoutSeconds: 5
            owner: vagrant
            mode: '0644'

        - name: Install/upgrade kube-prometheus-stack
          shell: |
            helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
              -n monitoring \
              --create-namespace \
              --timeout 20m \
              -f /home/vagrant/kube-prometheus-values.yaml

        - name: Install Grafana Loki (Logs Backend)
          kubernetes.core.helm:
            name: loki
            chart_ref: grafana/loki
            release_namespace: "{{ monitoring_namespace }}"
            wait: true
            timeout: "10m"
            values:
              deploymentMode: SingleBinary
              loki:
                auth_enabled: false
                commonConfig:
                  replication_factor: 1
                storage:
                  type: filesystem
                useTestSchema: true
              singleBinary: { replicas: 1 }
              read: { replicas: 0 }
              write: { replicas: 0 }
              backend: { replicas: 0 }
              gateway: { enabled: false }
              chunksCache: { enabled: false }
              resultsCache: { enabled: false }
              lokiCanary: { enabled: false }
              test: { enabled: false }

        - name: Install Promtail (Logs Collector)
          kubernetes.core.helm:
            name: promtail
            chart_ref: grafana/promtail
            release_namespace: "{{ monitoring_namespace }}"
            wait: true
            timeout: "10m"
            values:
              config:
                clients:
                  - url: http://loki:3100/loki/api/v1/push

        - name: Install Grafana Tempo
          kubernetes.core.helm:
            name: tempo
            chart_ref: grafana/tempo
            release_namespace: "{{ monitoring_namespace }}"
            wait: true
            timeout: "10m"
            values:
              persistence:
                enabled: true
                storageClass: "local-path"
                size: 10Gi
              tempo:
                searchEnabled: true
                memberlist:
                  service:
                    publishNotReadyAddresses: true
                config:
                  multitenancy_enabled: false
                  compactor:
                    ring:
                      kvstore:
                        store: memberlist
                  ingester:
                    lifecycler:
                      ring:
                        kvstore:
                          store: memberlist
                  storage:
                    trace:
                      backend: local
                      local:
                        path: /var/tempo/traces
                      wal:
                        path: /var/tempo/wal

        - name: Install OpenTelemetry Operator
          kubernetes.core.helm:
            name: opentelemetry-operator
            chart_ref: open-telemetry/opentelemetry-operator
            release_namespace: "{{ monitoring_namespace }}"
            wait: true
            values:
              manager:
                collectorImage:
                  repository: otel/opentelemetry-collector-k8s

        - name: Copy PANOPTES Collector manifest to target
          copy:
            dest: "/home/vagrant/panoptes-collector.yml"
            content: |
              apiVersion: opentelemetry.io/v1alpha1
              kind: OpenTelemetryCollector
              metadata:
                name: panoptes-collector
                namespace: monitoring
              spec:
                config: |
                  receivers:
                    otlp:
                      protocols:
                        grpc:
                        http:
                  processors:
                    batch: {}
                  exporters:
                    otlp/tempo:
                      endpoint: "tempo.monitoring.svc.cluster.local:4317"
                      tls:
                        insecure: true
                  service:
                    telemetry:
                      logs:
                        level: "info"
                    pipelines:
                      traces:
                        receivers: [otlp]
                        processors: [batch]
                        exporters: [otlp/tempo]
            owner: vagrant
            mode: '0644'

        - name: Apply PANOPTES Central Collector Custom Resource
          kubernetes.core.k8s:
            state: present
            src: "/home/vagrant/panoptes-collector.yml"

        - name: Apply ServiceMonitor for Tempo
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: tempo-monitor
                namespace: "{{ monitoring_namespace }}"
                labels:
                  release: kube-prometheus-stack
              spec:
                selector:
                  matchLabels:
                    app.kubernetes.io/name: tempo
                endpoints:
                - port: prom-metrics
                  interval: 30s
      rescue:
        - fail:
            msg: "[CRITICAL] Observability stack deployment failed. Ensure worker nodes have sufficient memory and check Helm logs."